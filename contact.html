<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Ognjen Mičić</title>

  <!-- Font & main stylesheet -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Small form-specific styles to ensure consistent layout -->
  <style>
    /* Ensure form controls match and button sits below */
    .contact-form {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }

    .contact-form form {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-form label {
      display: none; /* visually-hidden labels could be added for accessibility if desired */
    }

    .contact-form input[type="text"],
    .contact-form input[type="email"],
    .contact-form textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 15px;
      resize: vertical;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--primary, #fbfe0d);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      background: rgba(0,0,0,0.6);
    }

    .contact-form textarea {
      min-height: 120px;
      max-height: 320px;
    }

    /* Button placed under fields and centered */
    .contact-form .btn {
      width: 220px;
      align-self: center;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: var(--primary, #fbfe0d);
      color: var(--primary-contrast, #111);
      font-weight: 700;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .contact-form .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    /* If you prefer the button full-width on small screens */
    @media (max-width: 520px) {
      .contact-form .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header (shared) -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Ognjen Mičić - Home">
        <img src="about_me_190x286.jpg" alt="Ognjen Mičić" class="profile-pic">
        <div>
          <h3>Ognjen Mičić</h3>
          <p>Full-Stack Developer</p>
        </div>
      </a>

      <!-- Desktop nav -->
      <nav class="primary-nav" role="navigation" aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>

      <!-- Mobile controls -->
      <button class="hamburger" id="hamburger" aria-controls="mobileMenu" aria-expanded="false" aria-label="Open menu">
        <span class="bar" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Mobile menu -->
    <div id="mobileMenu" class="mobile-menu" aria-hidden="true">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </header>

  <!-- Main content -->
  <main class="container" role="main">
    <section class="hero" aria-label="Contact">
      <div class="text" style="max-width:820px; margin:0 auto; text-align:center;">
        <h1>Contact Me</h1>
        <h2>Let's work together</h2>

        <div class="contact-info" style="margin-top:18px; color:#fff; opacity:0.95;">
          <p><strong>Ognjen Mičić</strong></p>
          <p>Hilandarska 24, Istočno Sarajevo</p>
          <p>Bosnia and Herzegovina</p>
          <p>📞 <a href="tel:+38766203651" style="color:var(--primary); text-decoration:none;">+387 66 203 651</a></p>
          <p>✉️ <a href="mailto:info@ommedia.link" style="color:var(--primary); text-decoration:none;">info@ommedia.link</a></p>
        </div>

        <div class="contact-form">
          <form action="#" method="POST" novalidate>
            <!-- Labels hidden (good for accessibility) — add visible labels if you prefer -->
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" placeholder="Your Name" required>

            <label for="email">Your email</label>
            <input id="email" name="email" type="email" placeholder="Your Email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Your Message" required></textarea>

            <button type="submit" class="btn">Send Message</button>
          </form>
        </div>

      </div>
    </section>
  </main>

  <script>
    (function(){
      const hamburger = document.getElementById('hamburger');
      const mobileMenu = document.getElementById('mobileMenu');

      function toggleMenu(){
        const isOpen = hamburger.classList.toggle('active');
        mobileMenu.classList.toggle('open', isOpen);
        hamburger.setAttribute('aria-expanded', String(isOpen));
        mobileMenu.setAttribute('aria-hidden', String(!isOpen));
      }

      hamburger.addEventListener('click', toggleMenu);

      // Close menu when clicking a link (mobile)
      mobileMenu.addEventListener('click', function(e){
        if(e.target.tagName === 'A'){
          setTimeout(() => {
            hamburger.classList.remove('active');
            mobileMenu.classList.remove('open');
            hamburger.setAttribute('aria-expanded','false');
            mobileMenu.setAttribute('aria-hidden','true');
          }, 80);
        }
      });

      // Close mobile menu on resize to desktop
      window.addEventListener('resize', function(){
        if(window.innerWidth > 768){
          hamburger.classList.remove('active');
          mobileMenu.classList.remove('open');
          hamburger.setAttribute('aria-expanded','false');
          mobileMenu.setAttribute('aria-hidden','true');
        }
      });

      // Close on Escape
      window.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
          hamburger.classList.remove('active');
          mobileMenu.classList.remove('open');
          hamburger.setAttribute('aria-expanded','false');
          mobileMenu.setAttribute('aria-hidden','true');
        }
      });
    })();
  </script>

</body>
</html>
